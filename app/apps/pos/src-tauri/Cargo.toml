[package]
name = "dastarhan-pos"
version = "1.0.0"
description = "Dastarhan POS"
edition = "2021"

[[bin]]
name = "dastarhan-pos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
